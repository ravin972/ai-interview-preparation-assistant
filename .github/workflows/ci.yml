name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    env:
      # Deterministic and offline. CI never needs a provider key, so an expired
      # free tier or a provider outage can never turn the build red.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean clone path)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Web production build
        run: npm run build --workspace=@kit/web

      - name: Validate Docker Compose configuration
        run: docker compose config
